name: Boothkeepr reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: notify
        run: npm install --no-audit --no-fund
      - name: Send due reminders
        id: notify
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node notify.mjs
      - name: Get the browser for the invoice autopilot
        if: steps.notify.outputs.robot == 'true'
        working-directory: notify
        run: npm install --no-audit --no-fund --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Make invoices (autopilot)
        if: steps.notify.outputs.robot == 'true'
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node robot.mjs
