<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Make SocialKeepr PhotoBooth tax invoices as PDFs. Works offline.">
<meta name="theme-color" content="#b0127a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SK Invoices">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>SocialKeepr Invoice Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: invoice list in a left sidebar; the main pane switches between dashboard, editor and a saved invoice. */
:root {
  --bg: #f5f3f6;
  --panel: #ffffff;
  --side: #efecf1;
  --fg: #1f1a24;
  --muted: #6b6273;
  --line: #e2dde6;
  --field: #faf9fb;
  --accent: #b0127a;
  --accent-ink: #ffffff;
  --accent-soft: #fbe7f3;
  --good: #1f7a4d;
  --good-soft: #e3f4ea;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --grid: #ebe7ee;
  --paper: #ffffff;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a; --panel: #211c25; --side: #1c1720; --fg: #efe9f2; --muted: #a79fae; --line: #362f3c;
    --field: #1b171f; --accent: #f05bb8; --accent-ink: #1a0d15; --accent-soft: #3a1d30;
    --good: #5fd39a; --good-soft: #173528; --warn: #f0b860; --warn-soft: #3a2c14; --grid: #2c2631; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a; --panel: #211c25; --side: #1c1720; --fg: #efe9f2; --muted: #a79fae; --line: #362f3c;
  --field: #1b171f; --accent: #f05bb8; --accent-ink: #1a0d15; --accent-soft: #3a1d30;
  --good: #5fd39a; --good-soft: #173528; --warn: #f0b860; --warn-soft: #3a2c14; --grid: #2c2631; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button { font: inherit; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
@media (min-width: 900px) { .app { grid-template-columns: 290px minmax(0, 1fr); } }

/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 900px) { .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; } }
@media (max-width: 899px) { .side { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 9px; }
.brand b { display: block; font-size: 15px; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 899px) { .nav { flex-direction: row; flex-wrap: wrap; } }
.navbtn { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.navbtn:hover { background: var(--panel); }
.navbtn[aria-current="page"] { background: var(--panel); border-color: var(--line); font-weight: 600; }
.navbtn.new { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.navbtn.new:hover { filter: brightness(1.08); background: var(--accent); }
.listhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.listtoggle { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 3px 8px; cursor: pointer; font-size: 12px; text-transform: none; letter-spacing: 0; }
@media (max-width: 899px) { .listtoggle { display: inline-block; } .side.collapsed .invlist { display: none; } }
.invlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.invbtn { width: 100%; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 10px; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.invbtn:hover { background: var(--panel); }
.invbtn[aria-current="page"] { background: var(--panel); border-color: var(--line); }
.invbtn .no { font-family: var(--font-num); font-weight: 500; grid-row: 1 / 3; align-self: center; min-width: 2.6em; }
.invbtn .d { font-size: 13px; }
.invbtn .t { font-family: var(--font-num); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.invbtn .s { grid-column: 2 / 4; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.paid { background: var(--good); } .dot.unpaid { background: var(--warn); }
.sidenote { font-size: 12px; color: var(--muted); margin: 0; }
.backup { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: auto; }
.linkish { background: none; border: 0; padding: 2px 0; color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* main */
.main { min-width: 0; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .main { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 16px; }
.pagehead h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.pagehead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 0; }
.notice.warn { background: var(--warn-soft); }
.notice button { margin-left: 6px; }

/* dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tile .v { font-family: var(--font-num); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.hero .v { color: var(--accent); font-size: clamp(20px, 6.2vw, 28px); }
.tiles.small .tile .v { font-size: 19px; }
.chartwrap { position: relative; }
.chartwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); font-variant-numeric: tabular-nums; }
.recent { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 330px; }
.recent th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 8px; }
.recent td { padding: 9px 8px; border-top: 1px solid var(--line); }
.recent td.r, .recent th.r { text-align: right; }
.recent td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.recent tr.click { cursor: pointer; } .recent tr.click:hover td { background: var(--field); }
.scrollx { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.pill.paid { background: var(--good-soft); color: var(--good); } .pill.unpaid { background: var(--warn-soft); color: var(--warn); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 1300px) { .twocol { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; padding: 34px 16px; cursor: pointer; background: var(--field); }
.drop b { color: var(--accent); font-size: 16px; }
.drop span { color: var(--muted); font-size: 14px; }
.drop.over, .drop:hover { border-color: var(--accent); }
.imptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
.imptable th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 8px; }
.imptable th.r, .imptable td.r { text-align: right; }
.imptable td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.imptable td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.imptable td.fn { max-width: 230px; overflow-wrap: anywhere; }
.imptable td.nt { color: var(--muted); font-size: 13px; }
.imptable input[type=number] { width: 80px; } .imptable input[type=date] { width: 150px; }
.imptable input[type=checkbox] { width: auto; }
.imptable tr.lv-check td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.imptable tr.lv-bad td:first-child { box-shadow: inset 3px 0 0 var(--warn); } .imptable tr.lv-bad td.nt { color: var(--warn); }
button[disabled] { opacity: .5; cursor: not-allowed; }
.monthname { min-width: 9.5em; text-align: center; font-size: 15px; }
.weekchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.wchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.wchip .tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 4px; }
.tileact { justify-content: space-between; } .tileact .primary { padding: 9px 14px; align-self: flex-start; }
.dayblock h3 { font-size: 15px; margin: 6px 0 10px; } .dayblock h3 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.job header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.job header b { font-family: var(--font-num); font-size: 14px; margin-right: auto; }
.job .jt { margin: 0; font-weight: 600; } .job .jv { margin: 0; color: var(--muted); font-size: 13px; }
.job dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 4px 0 0; font-size: 13px; }
.job dl div { display: contents; } .job dt { color: var(--muted); } .job dd { margin: 0; overflow-wrap: anywhere; }
.pill.neutral { background: var(--field); color: var(--muted); border: 1px solid var(--line); } .pill.att { background: var(--accent-soft); color: var(--accent); }
.filebtn { display: inline-block; cursor: pointer; }
.rcptbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rcptbar .hint { margin: 0; flex: 1 1 260px; }
.rcptlist { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.rcpt { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
.rcpt img { width: 90px; border-radius: 6px; border: 1px solid var(--line); }
.rcptf { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.rcptf select, .rcptf input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
#rcptBox .actions { margin-top: 12px; }
.rowbtns { white-space: nowrap; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.ovbox { background: var(--panel); border-radius: 12px; padding: 14px; max-width: min(520px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.ovbox img { max-height: 70vh; border-radius: 6px; } .ovbox p { margin: 0; font-size: 14px; }
.acct { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--fg); cursor: pointer; }
.acct span { display: flex; flex-direction: column; min-width: 0; } .acct b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .acct small { font-size: 12px; color: var(--muted); }
.acct[aria-current="page"] { border-color: var(--accent); }
.authcard { max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
.gbtn { width: 100%; font-weight: 600; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; } .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.syncline { display: flex; gap: 8px; align-items: center; margin: 0; }
.sharepanel { margin-top: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); display: flex; flex-direction: column; gap: 10px; }
.sharepanel p { margin: 0; font-size: 14px; }
.pwrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; } .pwrow label { flex: 1 1 200px; }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; } .linkrow input { flex: 1 1 240px; font-family: var(--font-num); font-size: 12px; }
.shareview { min-height: 100vh; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lockcard { max-width: 420px; margin: 8vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.lockcard h1 { margin: 0; font-size: 22px; } .lockcard p { margin: 0; color: var(--muted); font-size: 14px; }
.lockLogo { width: 64px; height: 64px; border-radius: 12px; }
.sharedoc { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheetbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.sheetbox p { margin: 0; font-size: 14px; }

/* editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 1480px) { .editor { grid-template-columns: minmax(0, 1fr) minmax(0, 480px); } .editor .previewcol { position: sticky; top: 20px; } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.tablebox { overflow-x: auto; margin: 0 -6px; }
.items { width: 100%; border-collapse: collapse; min-width: 520px; }
.items th { font-size: 12px; text-align: left; color: var(--muted); font-weight: 500; padding: 0 6px 6px; }
.items td { padding: 4px 6px; vertical-align: middle; }
.items td.amt { font-family: var(--font-num); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.items input { padding: 7px 8px; }
.items .num { font-family: var(--font-num); text-align: right; }
.iconbtn { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 6px; cursor: pointer; width: 32px; height: 32px; font-size: 18px; line-height: 1; }
.iconbtn:hover { color: var(--accent); border-color: var(--line); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.addlabel { font-size: 13px; color: var(--muted); margin-right: 2px; }
button.chip { font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px dashed var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.totals .v { font-family: var(--font-num); text-align: right; }
.totals .grand { font-weight: 700; font-size: 17px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.primary { font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
button.primary:hover { filter: brightness(1.08); }
button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px; cursor: pointer; }
button.secondary:hover { border-color: var(--accent); }
button.danger { background: none; color: var(--warn); border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px; cursor: pointer; }
button.danger:hover { border-color: var(--warn); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 10px 0 0; }
.status.ok { color: var(--good); } .status.bad { color: var(--warn); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--warn-soft); padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
.paperbox { background: var(--line); border-radius: 12px; padding: 14px; }
.paper { background: var(--paper); border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); overflow: hidden; }
.paper svg { display: block; width: 100%; height: auto; }
.prevlabel { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.fname { font-family: var(--font-num); overflow-wrap: anywhere; }
.viewgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 1100px) { .viewgrid { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="app">
  <aside class="side collapsed" id="side">
    <div class="brand"><img id="brandLogo" alt=""><div><b>SocialKeepr Invoices</b><span>Photo Booth Event Services</span></div></div>
    <button class="acct" type="button" id="acctBtn"></button>
    <nav class="nav" aria-label="Main">
      <button class="navbtn new" type="button" id="navNew">+ New invoice</button>
      <button class="navbtn" type="button" id="navDash">Dashboard</button>
      <button class="navbtn" type="button" id="navRun">Run sheet</button>
      <button class="navbtn" type="button" id="navImport">Import old invoices</button>
    </nav>
    <div class="listhead"><span id="listCount">Invoices</span><button class="listtoggle" type="button" id="listToggle" aria-expanded="false">Show</button></div>
    <ul class="invlist" id="invList"></ul>
    <p class="sidenote" id="storeNote"></p>
    <div class="backup"><button class="linkish" type="button" id="bExport">Back up all invoices</button><label class="linkish" for="bImport">Restore from a backup</label><input id="bImport" type="file" accept=".json,application/json" hidden></div>
    <p class="sidenote" id="backupMsg" role="status"></p>
  </aside>

  <main class="main"><div class="inner" id="view"></div></main>
</div>

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('skinv.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('skinv.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('skinv.' + k); } catch (e) {} }
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return d + ' ' + MONTHS[m-1] + ' ' + y; }
function num(v) { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function money(n) { return '$' + round2(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function aud(n) { return round2(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' AUD'; }
function rateStr(n) { const s = (Math.round(n * 1000) / 1000).toFixed(3).replace(/0+$/, '').replace(/\.$/, ''); const [a,b] = s.split('.'); return '$' + Number(a).toLocaleString('en-AU') + (b ? '.' + b : ''); }
function qtyStr(r) { const q = r.qty === '' || r.qty == null ? '' : String(r.qty); const u = (r.unit || '').trim(); if (!q) return ''; if (!u) return q; return u.length <= 1 ? q + u : q + ' ' + u; }
function roman(n) { return ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'][n-1] || String(n); }
function amountOf(r) { return r.fixedAmount != null ? round2(num(r.fixedAmount)) : round2(num(r.qty) * num(r.rate)); } // fixedAmount: the amount typed on an imported invoice
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
const isFuel = r => /fuel/i.test(r.desc || '');
const isEvent = r => /event/i.test(r.desc || '');
const isAttendant = r => /attendant/i.test(r.desc || '');

/* ---------- invoice maths ---------- */
function totalsOf(inv) {
  const calc = round2((inv.rows || []).reduce((s, r) => s + amountOf(r), 0));
  const sub = inv.totalOverride != null ? round2(num(inv.totalOverride)) : calc;
  const gst = inv.gst ? round2(sub * 0.1) : 0;
  return { calc, sub, gst, all: round2(sub + gst) };
}
function fileNameOf(inv) { return 'TAX INVOICE ' + (inv.no || '') + ' - ' + fmtDate(inv.date) + '.pdf'; }

/* ---------- data: invoices live in the page's private database (falls back to this browser) ---------- */
const profile = store.get('profile', { name: '', tfn: '' });
let invoices = [];          // array of invoice records
let loaded = false;
let db = null, downloads = null, mode = 'loading';

function sorted() { return invoices.slice().sort((a, b) => (b.no || 0) - (a.no || 0)); }
function byNo(no) { return invoices.find(i => Number(i.no) === Number(no)); }
function nextNo() { return invoices.reduce((m, i) => Math.max(m, Number(i.no) || 0), 0) + 1; }

async function saveInvoice(rec) {
  rec.updatedAt = new Date().toISOString();
  if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  if (mode === 'cloud') { cloud.putInvoice(rec).catch(() => {}); invoices = invoices.filter(i => Number(i.no) !== Number(rec.no)).concat([clone(rec)]); }
  else if (mode === 'db') {
    await db.collection('invoices').doc('inv-' + rec.no).set(clone(rec));
  } else {
    invoices = invoices.filter(i => Number(i.no) !== Number(rec.no)).concat([clone(rec)]);
    store.set('invoices', invoices); render();
  }
}
async function deleteInvoice(no) {
  const gone = byNo(no); (gone && gone.rows || []).forEach(r => { if (r.receiptId) delReceipt(r.receiptId); });
  if (mode === 'cloud') { cloud.delInvoice(no).catch(() => {}); invoices = invoices.filter(i => Number(i.no) !== Number(no)); }
  else if (mode === 'db') await db.collection('invoices').doc('inv-' + no).delete();
  else { invoices = invoices.filter(i => Number(i.no) !== Number(no)); store.set('invoices', invoices); render(); }
}

// Invoices saved in this browser before the database existed get copied across once.
async function migrateLocal() {
  const old = store.get('invoices', []).concat((store.get('history', []) || []).map(h => Object.assign({}, h.state, { paid: false })));
  for (const rec of old) { if (rec && rec.no && !byNo(rec.no)) { try { await saveInvoice(rec); } catch (e) {} } }
  store.del('history'); store.del('invoices');
}

// The most recent row matching a test, from saved invoices (newest first).
function lastRow(test) { for (const inv of invoices.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.no || 0) - (a.no || 0))) { const r = (inv.rows || []).find(test); if (r) return r; } return null; }
// Optional extras offered as quick-add buttons: attendant plus anything billed before (Uber, albums, glue & pens …), with the last rate used.
function extraItems() {
  const seen = new Map();
  invoices.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(inv => (inv.rows || []).forEach(r => {
    const d = (r.desc || '').trim(); if (!d || isEvent(r) || isFuel(r)) return;
    const key = d.toLowerCase().replace(/\s*\([ivx\d]+\)\s*$/, '');
    if (!seen.has(key)) seen.set(key, { desc: d.replace(/\s*\([ivx\d]+\)\s*$/, ''), unit: r.unit || '', rate: r.rate === '' || r.rate == null ? '' : r.rate });
  }));
  if (![...seen.keys()].some(k => /attendant/.test(k))) seen.set('attendant', { desc: 'Attendant', unit: 'hrs', rate: 30 });
  return [...seen.values()].sort((a, b) => (/attendant/i.test(b.desc) ? 1 : 0) - (/attendant/i.test(a.desc) ? 1 : 0) || a.desc.localeCompare(b.desc));
}
function freshDraft() {
  const last = sorted()[0];
  // Every week has events and fuel. Everything else (attendant, Uber, albums …) is added only when needed.
  const ev = lastRow(isEvent);
  const rows = [
    { desc: ev ? ev.desc : 'Photo Booth Events', qty: '', unit: ev ? ev.unit || 'Events' : 'Events', rate: ev && ev.rate !== '' ? ev.rate : 150 },
    { desc: 'Fuel (i)', qty: '', unit: 'L', rate: '' }
  ];
  return { no: nextNo(), date: todayISO(), billedTo: last ? last.billedTo : 'Social Keepr', services: last ? last.services : 'Photo Booth Event Services',
    hours: '', hoursDays: '', gst: false, paid: false, rows, editing: null };
}

function chartSVG(byMonth) {

  const first = invoices.map(i => i.date).filter(Boolean).sort()[0];
  let span = 12; if (first) { const [fy, fm] = first.split('-').map(Number); span = Math.min(24, Math.max(12, (now.getFullYear() - fy) * 12 + (now.getMonth() + 1 - fm) + 1)); }

    'auth/email-already-in-use': 'There is already an account with that email. Sign in instead.', 'auth/weak-password': 'Use a password of at least 6 characters.', 'auth/invalid-email': 'That email address does not look right.',
    'auth/popup-closed-by-user': 'The Google window was closed before signing in finished.', 'auth/popup-blocked': 'Your browser blocked the Google window. Allow pop-ups for this site, or use email and password.',
    'auth/network-request-failed': 'No internet connection. Connect and try again.', 'auth/too-many-requests': 'Too many tries. Wait a few minutes and try again.', 'auth/unauthorized-domain': 'Google sign-in is not switched on for this website yet.' })[c] || 'Sign-in did not work (' + (c || 'unknown error') + ').';
}
function renderAccount() {
  const v = $('view');
  if (!FIREBASE_CONFIG || window.claude) { v.innerHTML = '<div class="pagehead"><div><h1>Sign in and sync</h1><p>Sync is not switched on for this copy yet.</p></div></div><section class="card"><p class="empty">Your invoices are saved on this device only for now.</p></section>'; return; }
  if (!cloud.ready) { v.innerHTML = '<div class="pagehead"><div><h1>Sign in and sync</h1><p>' + (cloud.status === 'unavailable' ? 'Could not load sign-in. Check your internet connection and reload.' : 'Loading…') + '</p></div></div>'; return; }
  if (cloud.user) {
    const u = cloud.user;
    v.innerHTML = '<div class="pagehead"><div><h1>Your account</h1><p>Signed in as ' + esc(u.email || u.displayName || 'you') + '</p></div></div>' +
      '<section class="card"><h2>Sync</h2><p class="syncline"><i class="dot ' + (cloud.status === 'synced' ? 'paid' : 'unpaid') + '"></i>' + esc(syncText()) + '</p>' +
      '<p class="hint">Your invoices, receipts, details and run sheet link are saved to your account and show up on every phone or computer you sign in on. You can keep working with no internet; changes upload when you are back online.</p></section>' +
      '<section class="card"><h2>Sign out</h2><p class="hint" style="margin-top:0">Signing out removes your invoices from this device. They stay safe in your account.</p><div class="actions" style="margin-top:10px"><button class="secondary" type="button" id="acOut">Sign out</button></div></section>';
    $('acOut').addEventListener('click', () => { $('acOut').disabled = true; cloud.signOutAll(); });
    return;
  }
  v.innerHTML = '<div class="pagehead"><div><h1>Sign in to sync</h1><p>Use the same account on your phone and computer to see the same invoices on both.</p></div></div>' +
    '<section class="card authcard"><button class="secondary gbtn" type="button" id="acGoogle">Continue with Google</button><div class="or"><span>or use email</span></div>' +
    '<form id="acForm" class="stack" novalidate><label class="f">Email<input id="acEmail" type="email" autocomplete="username" required></label><label class="f">Password<input id="acPw" type="password" autocomplete="current-password" required minlength="6"></label>' +
    '<div class="actions"><button class="primary" type="submit" id="acIn">Sign in</button><button class="secondary" type="button" id="acNew">Create account</button><button class="linkish" type="button" id="acReset">Forgot password?</button></div></form>' +
    '<p class="status" id="status" role="status"></p>' +
    (invoices.length ? '<p class="hint">The ' + invoices.length + ' invoice' + (invoices.length === 1 ? '' : 's') + ' already on this device will be copied into your account when you sign in.</p>' : '') + '</section>';
  const F = window.SKFB; const busy = b => ['acGoogle', 'acIn', 'acNew'].forEach(id => { if ($(id)) $(id).disabled = b; });
  const run = async fn => { busy(true); say(''); try { await fn(); } catch (e) { say(authError(e), 'bad'); } busy(false); };
  $('acGoogle').addEventListener('click', () => run(() => F.signInWithPopup(cloud.auth, new F.GoogleAuthProvider())));
  $('acForm').addEventListener('submit', e => { e.preventDefault(); run(() => F.signInWithEmailAndPassword(cloud.auth, $('acEmail').value.trim(), $('acPw').value)); });
  $('acNew').addEventListener('click', () => run(async () => { const c = await F.createUserWithEmailAndPassword(cloud.auth, $('acEmail').value.trim(), $('acPw').value); if (profile.name) await F.updateProfile(c.user, { displayName: profile.name }); }));
  $('acReset').addEventListener('click', () => { const em = $('acEmail').value.trim(); if (!em) { say('Type your email first, then press "Forgot password?".', 'bad'); return; } run(async () => { await F.sendPasswordResetEmail(cloud.auth, em); say('Check your email for a link to set a new password.', 'ok'); }); });
}
function syncText() { return ({ synced: 'All changes saved to your account.', syncing: 'Saving changes…', offline: 'Offline. Changes will upload when you are back online.', error: 'Could not reach your account. Changes are kept on this device for now.' })[cloud.status] || ''; }

/* ---------- password-protected share links ----------
   The invoice is encrypted in the browser (AES-GCM, key from the password with PBKDF2) and the result
   is placed after the # in the link. The part after # is never sent to any server; only someone with
   the password can open it. */
const SHARE_BASE = 'https://punit-code.github.io/socialkeepr-invoices/';
const b64u = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; } };
async function streamThrough(u8, stream) { const out = new Response(new Blob([u8]).stream().pipeThrough(stream)); return new Uint8Array(await out.arrayBuffer()); }
async function pwKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makeShareLink(inv, pw) {
  const payload = { v: 1, inv: clone(inv), name: profile.name || '', tfn: profile.tfn || '', made: new Date().toISOString() };
  delete payload.inv.note; delete payload.inv.importedFrom;
  let data = new TextEncoder().encode(JSON.stringify(payload)); let flag = 2;
  if (typeof CompressionStream === 'function') { try { data = await streamThrough(data, new CompressionStream('deflate-raw')); flag = 1; } catch (e) {} }
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await pwKey(pw, salt), data));
  const all = new Uint8Array(1 + 16 + 12 + ct.length); all[0] = flag; all.set(salt, 1); all.set(iv, 17); all.set(ct, 29);
  return SHARE_BASE + '#inv=' + b64u.enc(all);
}
async function openShareLink(token, pw) {
  const all = b64u.dec(token); const flag = all[0];
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(17, 29) }, await pwKey(pw, all.slice(1, 17)), all.slice(29)));
  const bytes = flag === 1 ? await streamThrough(plain, new DecompressionStream('deflate-raw')) : plain;
  return JSON.parse(new TextDecoder().decode(bytes));
}
const shareToken = (location.hash.match(/^#inv=([A-Za-z0-9_-]+)$/) || [])[1] || null;
function renderShareViewer() {
  document.querySelector('.app').hidden = true;
  const box = document.createElement('div'); box.className = 'shareview'; box.id = 'shareView'; document.body.appendChild(box);
  box.innerHTML = '<div class="lockcard"><img src="' + LOGO + '" alt="" class="lockLogo"><h1>Tax invoice</h1><p>This invoice is protected. Enter the password you were given to open it.</p>' +
    '<form id="pwForm" class="pwrow"><label class="f" for="pwIn">Password<input id="pwIn" type="password" autocomplete="off" autofocus></label><button class="primary" type="submit" id="pwGo">Open invoice</button></form><p class="status" id="pwMsg" role="status"></p></div>';
  $('pwForm').addEventListener('submit', async e => {
    e.preventDefault(); const pw = $('pwIn').value; if (!pw) return;
    $('pwGo').disabled = true; $('pwMsg').className = 'status'; $('pwMsg').textContent = 'Opening…';
    try {
      const p = await openShareLink(shareToken, pw);
      Object.assign(profile, { name: p.name, tfn: p.tfn }); // shown on this invoice only; nothing is saved
      const inv = p.inv; const t = totalsOf(inv);
      box.innerHTML = '<div class="sharedoc"><div class="pagehead"><div><h1>Tax invoice ' + esc(inv.no) + '</h1><p>From ' + esc(p.name || 'the sender') + ' · ' + esc(fmtDate(inv.date)) + ' · ' + esc(aud(t.all)) + '</p></div>' +
        '<div class="actions"><button class="primary" type="button" id="shDl">Download PDF</button></div></div><p class="status" id="status" role="status"></p>' +
        '<div class="paperbox"><div class="paper">' + paperSVG(inv) + '</div></div></div>';
      $('shDl').addEventListener('click', async () => { const r = await downloadPdf(inv); say(r.msg, r.ok ? 'ok' : 'bad'); });
    } catch (err) {
      $('pwGo').disabled = false; $('pwMsg').className = 'status bad';
      $('pwMsg').textContent = (err && err.name === 'OperationError') ? 'That password is not right. Check it and try again.' : 'This link could not be opened. It may have been cut short when it was copied.';
    }
  });
}
function wireSharePanel(inv) {
  $('vShare').addEventListener('click', () => {
    const box = $('shareBox'); if (box.innerHTML) { box.innerHTML = ''; return; }
    const saved = store.get('sharePw', '');
    box.innerHTML = '<div class="sharepanel"><p>Make a link your boss can open in any browser. They will need the password to see the invoice and download the PDF.</p>' +
      '<div class="pwrow"><label class="f" for="shPw">Password for this link<input id="shPw" type="text" autocomplete="off" value="' + esc(saved) + '" placeholder="Choose a password"></label><button class="primary" type="button" id="shMake">Create link</button></div>' +
      '<div id="shOut"></div><p class="hint">The invoice is locked inside the link itself. It is not uploaded anywhere. Send the password separately from the link (for example, tell them once in person or by text).</p></div>';
    $('shMake').addEventListener('click', async () => {
      const pw = $('shPw').value; if (pw.length < 6) { $('shOut').innerHTML = '<p class="status bad">Use a password of at least 6 characters.</p>'; return; }
      store.set('sharePw', pw); $('shMake').disabled = true;
      try {
        const link = await makeShareLink(inv, pw);
        $('shOut').innerHTML = '<div class="linkrow"><input id="shLink" type="text" readonly value="' + esc(link) + '" aria-label="Share link"><button class="secondary" type="button" id="shCopy">Copy link</button>' +
          (navigator.share && !window.claude ? '<button class="secondary" type="button" id="shSend">Send…</button>' : '') + '</div><p class="status" id="shMsg" role="status"></p>';
        $('shLink').addEventListener('focus', e => e.target.select());
        $('shCopy').addEventListener('click', () => {
          const done = ok => { $('shMsg').className = 'status ' + (ok ? 'ok' : ''); $('shMsg').textContent = ok ? 'Link copied. Paste it into your message.' : 'Select the link above and copy it.'; if (!ok) $('shLink').select(); };
          try { navigator.clipboard.writeText(link).then(() => done(true), () => done(false)); } catch (e) { done(false); }
        });
        if ($('shSend')) $('shSend').addEventListener('click', () => { navigator.share({ title: 'Tax invoice ' + inv.no, text: 'Tax invoice ' + inv.no + ' (' + fmtDate(inv.date) + ')', url: link }).catch(() => {}); });
      } catch (e) { $('shOut').innerHTML = '<p class="status bad">This browser could not make the link. Try a current version of Chrome, Safari or Edge.</p>'; }
      $('shMake').disabled = false;
    });
  });
}

if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

if (shareToken) renderShareViewer(); else render();
if (!window.jspdf && !shareToken) window.addEventListener('load', render);
(async function connect() {
  if (shareToken) { return; }
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (use) {
    try { downloads = await use('downloads'); } catch (e) { downloads = null; }
    try { db = await use('db'); } catch (e) { db = null; }
  }
  if (db) {
    mode = 'db';
    let migrated = false;
    db.collection('invoices').onSnapshot(snap => {
      invoices = snap.docs.map(d => d.data());
      loaded = true;
      if (!migrated) { migrated = true; migrateLocal(); }
      if (route.name === 'edit') renderSide(); else render();
    }, () => { mode = 'local'; invoices = store.get('invoices', []); loaded = true; render(); });
  } else {
    mode = 'local'; invoices = store.get('invoices', []);
    if (!invoices.length && window.SK_SEED && !store.get('seeded', false)) { invoices = clone(window.SK_SEED); store.set('invoices', invoices); store.set('seeded', true); }
    loaded = true; render();
    cloud.init();
  }
})();
</script>
