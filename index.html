<title>Boothkeepr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: invoice list in a left sidebar; the main pane switches between dashboard, editor and a saved invoice. */
:root {
  --bg: #f5f3f6;
  --panel: #ffffff;
  --side: #efecf1;
  --fg: #1f1a24;
  --muted: #6b6273;
  --line: #e2dde6;
  --field: #faf9fb;
  --accent: #b0127a;
  --accent-ink: #ffffff;
  --accent-soft: #fbe7f3;
  --good: #1f7a4d;
  --good-soft: #e3f4ea;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --grid: #ebe7ee;
  --pack: #0f7c80;
  --paper: #ffffff;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a; --panel: #211c25; --side: #1c1720; --fg: #efe9f2; --muted: #a79fae; --line: #362f3c;
    --field: #1b171f; --accent: #f05bb8; --accent-ink: #1a0d15; --accent-soft: #3a1d30;
    --good: #5fd39a; --good-soft: #173528; --warn: #f0b860; --warn-soft: #3a2c14; --grid: #2c2631; --pack: #45c3c5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a; --panel: #211c25; --side: #1c1720; --fg: #efe9f2; --muted: #a79fae; --line: #362f3c;
  --field: #1b171f; --accent: #f05bb8; --accent-ink: #1a0d15; --accent-soft: #3a1d30;
  --good: #5fd39a; --good-soft: #173528; --warn: #f0b860; --warn-soft: #3a2c14; --grid: #2c2631; --pack: #45c3c5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button { font: inherit; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
@media (min-width: 900px) { .app { grid-template-columns: 290px minmax(0, 1fr); } }

/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 900px) { .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; } }
@media (max-width: 899px) { .side { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 9px; }
.brand b { display: block; font-size: 15px; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 899px) { .nav { flex-direction: row; flex-wrap: wrap; } }
.navbtn { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.navbtn:hover { background: var(--panel); }
.navbtn[aria-current="page"] { background: var(--panel); border-color: var(--line); font-weight: 600; }
.navbtn.new { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.navbtn.new:hover { filter: brightness(1.08); background: var(--accent); }
.listhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.listtoggle { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 3px 8px; cursor: pointer; font-size: 12px; text-transform: none; letter-spacing: 0; }
@media (max-width: 899px) { .listtoggle { display: inline-block; } .side.collapsed .invlist { display: none; } }
.invlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.invbtn { width: 100%; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 10px; text-align: left; background: none; border: 1px solid transparent; color: var(--fg); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.invbtn:hover { background: var(--panel); }
.invbtn[aria-current="page"] { background: var(--panel); border-color: var(--line); }
.invbtn .no { font-family: var(--font-num); font-weight: 500; grid-row: 1 / 3; align-self: center; min-width: 2.6em; }
.invbtn .d { font-size: 13px; }
.invbtn .t { font-family: var(--font-num); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.invbtn .s { grid-column: 2 / 4; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.paid { background: var(--good); } .dot.unpaid { background: var(--warn); }
.sidenote { font-size: 12px; color: var(--muted); margin: 0; }
.backup { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: auto; }
.linkish { background: none; border: 0; padding: 2px 0; color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* main */
.main { min-width: 0; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .main { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 16px; }
.pagehead h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.pagehead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 0; }
.notice.warn { background: var(--warn-soft); }
.notice button { margin-left: 6px; }

/* dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tile .v { font-family: var(--font-num); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.hero .v { color: var(--accent); font-size: clamp(20px, 6.2vw, 28px); }
.tiles.small .tile .v { font-size: 19px; }
.chartwrap { position: relative; }
.chartwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); font-variant-numeric: tabular-nums; }
.recent { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 330px; }
.recent th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 8px; }
.recent td { padding: 9px 8px; border-top: 1px solid var(--line); }
.recent td.r, .recent th.r { text-align: right; }
.recent td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.recent tr.click { cursor: pointer; } .recent tr.click:hover td { background: var(--field); }
.scrollx { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.pill.paid { background: var(--good-soft); color: var(--good); } .pill.unpaid { background: var(--warn-soft); color: var(--warn); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 1300px) { .twocol { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; padding: 34px 16px; cursor: pointer; background: var(--field); }
.drop b { color: var(--accent); font-size: 16px; }
.drop span { color: var(--muted); font-size: 14px; }
.drop.over, .drop:hover { border-color: var(--accent); }
.imptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
.imptable th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 8px; }
.imptable th.r, .imptable td.r { text-align: right; }
.imptable td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.imptable td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.imptable td.fn { max-width: 230px; overflow-wrap: anywhere; }
.imptable td.nt { color: var(--muted); font-size: 13px; }
.imptable input[type=number] { width: 80px; } .imptable input[type=date] { width: 150px; }
.imptable input[type=checkbox] { width: auto; }
.imptable tr.lv-check td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.imptable tr.lv-bad td:first-child { box-shadow: inset 3px 0 0 var(--warn); } .imptable tr.lv-bad td.nt { color: var(--warn); }
button[disabled] { opacity: .5; cursor: not-allowed; }
.monthname { min-width: 9.5em; text-align: center; font-size: 15px; }
.weekchips { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.wchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.wchip .tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 4px; }
.tileact { justify-content: space-between; } .tileact .primary { padding: 9px 14px; align-self: flex-start; }
.dayblock { display: flex; flex-direction: column; gap: 10px; }
.dayblock h3 { display: flex; align-items: baseline; gap: 8px; font-size: 18px; margin: 14px 0 0; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.dayblock h3 .dname { color: var(--accent); }
.dayblock h3 .dcount { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted); }
.jobs { display: flex; flex-direction: column; gap: 12px; }
.job { display: grid; grid-template-columns: 96px minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 12px; overflow: hidden; }
.job.hasatt { border-left-color: var(--accent); } .job.haschk { border-left-color: var(--warn); }
.jtime { padding: 16px 12px; background: var(--field); display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
.jtime b { font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.1; } .jtime span { font-size: 13px; color: var(--muted); }
.jmain { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.jtop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .jtop h4 { margin: 0; font-size: 17px; }
.jtags { display: flex; flex-wrap: wrap; gap: 6px; } .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); color: var(--muted); }
.tag.att { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; } .tag.chk { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }
.jaddr { display: flex; gap: 6px; align-items: flex-start; color: var(--fg); text-decoration: none; font-size: 14px; line-height: 1.35; padding: 8px 10px; border-radius: 8px; background: var(--field); border: 1px solid var(--line); }
.jaddr svg { color: var(--accent); flex: none; margin-top: 1px; } .jaddr span { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; } .jaddr:hover { border-color: var(--accent); }
.jhours { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.fact { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); } .fact span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); } .fact b { font-size: 14px; overflow-wrap: anywhere; }
.fact.factwarn { border-color: var(--warn); background: var(--warn-soft); } .fact.factwarn b { color: var(--warn); }
.jcalls { display: flex; flex-wrap: wrap; gap: 8px; }
.callbtn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.callbtn small { font-weight: 400; opacity: .85; font-size: 13px; } .callbtn:hover { filter: brightness(1.08); }
.jmore summary { cursor: pointer; font-size: 13px; color: var(--accent); list-style-position: inside; }
.jmore dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; } .jmore dl div { display: contents; } .jmore dt { color: var(--muted); } .jmore dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .job { grid-template-columns: 1fr; } .jtime { flex-direction: row; align-items: baseline; gap: 8px; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; } }
.pill.neutral { background: var(--field); color: var(--muted); border: 1px solid var(--line); } .pill.att { background: var(--accent-soft); color: var(--accent); }
.filebtn { display: inline-block; cursor: pointer; }
.rcptbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rcptbar .hint { margin: 0; flex: 1 1 260px; }
.rcptlist { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.rcpt { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
.rcpt img { width: 90px; border-radius: 6px; border: 1px solid var(--line); }
.rcptf { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.wchip .tag.now { background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 999px; }
.dayblock { scroll-margin-top: 16px; } .dayblock.today > h3 .dname { color: var(--accent); }
.rcptf .rnote { grid-column: 1 / -1; margin: 0; }
.rcptf select, .rcptf input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
#rcptBox .actions { margin-top: 12px; }
.rowbtns { white-space: nowrap; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.ovbox { background: var(--panel); border-radius: 12px; padding: 14px; max-width: min(520px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.ovbox img { max-height: 70vh; border-radius: 6px; } .ovbox p { margin: 0; font-size: 14px; }
.acct { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--fg); cursor: pointer; }
.acct span { display: flex; flex-direction: column; min-width: 0; } .acct b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .acct small { font-size: 12px; color: var(--muted); }
.acct[aria-current="page"] { border-color: var(--accent); }
.authcard { max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
.gbtn { width: 100%; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
.glogo { flex: none; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; } .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.avatar { border-radius: 50%; object-fit: cover; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.avatar.initials { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.acct .dot { margin-left: auto; flex: none; }
.pfrow { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; } .pfpic { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.weekwarn { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.dialog { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
.dialog .box { background: var(--panel); color: var(--fg); border-radius: 14px; padding: 22px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.dialog h2 { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 0; } .dialog p { margin: 0; font-size: 14px; color: var(--muted); }
.sel { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.msjobs { display: flex; flex-direction: column; gap: 12px; }
.msjob { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.msjob.open { border-color: var(--accent); }
.mshead { width: 100%; text-align: left; background: none; border: 0; color: var(--fg); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; cursor: pointer; }
.mstime { font-family: var(--font-num); font-size: 13px; color: var(--muted); grid-column: 1; } .msname { font-weight: 600; grid-column: 1; } .msvenue { font-size: 13px; color: var(--muted); grid-column: 1; }
.mshead .pill { grid-column: 2; grid-row: 1 / 4; align-self: center; white-space: nowrap; }
.msbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.msbody textarea, .tplrow textarea, .tplrow input { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100%; resize: vertical; }
.tplchips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; } .segbtn { background: var(--field); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; } .segbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
a.sendbtn { display: inline-block; text-decoration: none; text-align: center; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 13px 18px; max-width: 100%; overflow-wrap: anywhere; }
a.sendbtn:hover { filter: brightness(1.08); } a.sendbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tpllist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; } .tpllist li { display: flex; flex-direction: column; gap: 2px; font-size: 14px; } .tpllist span { color: var(--muted); }

// start screen: stays until sign-in is known and the account's data has arrived from the server
// (invoices, details, settings and a fresh copy of the run sheet). Offline, the saved copy is enough.
const splash = (() => {
  const el = document.getElementById('splash'); const t0 = performance.now(); let done = false;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; const MIN = reduce ? 250 : 1900;
  const waiting = new Set(['auth']); let goneResolve; const gone = new Promise(r => { goneResolve = r; });
  const LABEL = { auth: 'Signing you in…', invoices: 'Loading your invoices…', profile: 'Loading your details…', settings: 'Loading your settings…', sheet: 'Checking the run sheet for changes…' };
  const ORDER = ['auth', 'invoices', 'profile', 'settings', 'sheet'];
  const say = t => { const st = document.getElementById('spStatus'); if (!done && st) st.textContent = t; };
  const hide = () => { if (done || !el) { goneResolve(); return; } done = true;
    setTimeout(() => { el.classList.add('out'); el.setAttribute('aria-hidden', 'true'); setTimeout(() => { el.remove(); goneResolve(); }, 650); }, Math.max(0, MIN - (performance.now() - t0))); };
  const check = () => { if (done) return; if (!waiting.size) return hide(); const next = ORDER.find(k => waiting.has(k)); if (next) say(LABEL[next]); };
  // a very slow connection must not trap anyone: offer a way in after 15 s, and let go after 60 s
  setTimeout(() => { if (done || !el) return; const box = el.querySelector('.sp-center'); const b = document.createElement('button'); b.type = 'button'; b.className = 'sp-skip'; b.textContent = 'Open anyway';
    b.addEventListener('click', hide); const n = document.createElement('div'); n.className = 'sp-slow'; n.textContent = 'This is taking longer than usual. Your data keeps loading in the background.'; box.append(n, b); }, 15000);
  setTimeout(hide, 60000);
  return { need(...k) { k.forEach(x => waiting.add(x)); check(); }, ok(...k) { k.forEach(x => waiting.delete(x)); check(); }, status: say, hide() { waiting.clear(); hide(); }, gone, get open() { return !done; } };
})();

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

}

function avatarHTML(size) {

  if (mb.photo) return '<img class="avatar" src="' + esc(mb.photo) + '" alt="" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px">';
  return '<span class="avatar initials" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.4) + 'px" aria-hidden="true">' + esc(label.charAt(0).toUpperCase()) + '</span>';

// Centre-crop a photo to a small square (kept small so it syncs quickly).
function squarePhoto(file, side) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { const m = Math.min(im.width, im.height); const c = document.createElement('canvas'); c.width = c.height = side; const g = c.getContext('2d');
      g.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, side, side); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); }; im.src = url; });
}

// Australian numbers: the run sheet drops leading zeros ("449805488") or uses 61…; turn them into +61…
function cleanPhone(raw) {
  const s = String(raw || '').replace(/[‎‏‪-‮]/g, ''); const plus = /^\s*\+/.test(s); let d = s.replace(/\D/g, '');
  if (!d) return null;
  if (d.startsWith('61') && d.length === 11) return '+' + d;
  if (d.length === 10 && d[0] === '0') return '+61' + d.slice(1);
  if (d.length === 9 && /^[2-478]/.test(d)) return '+61' + d;
  if (plus && d.length >= 8) return '+' + d;
  return d.length >= 8 && d.length <= 15 ? d : null;
}
function showPhone(p) { if (!p) return ''; if (/^\+614\d{8}$/.test(p)) return '0' + p.slice(3, 6) + ' ' + p.slice(6, 9) + ' ' + p.slice(9); if (/^\+61[2378]\d{8}$/.test(p)) return '(0' + p[3] + ') ' + p.slice(4, 8) + ' ' + p.slice(8); return p; }
function contactsFor(job) {
  const out = []; const main = cleanPhone(job.phone);
  if (main) out.push({ who: firstName(job.client) || 'Client', num: main, label: 'Client' });
  const c2 = String(job.contact2 || '').replace(/[‎‏‪-‮]/g, '');
  const m = c2.match(/(\+?\d[\d\s]{7,15}\d)/);
  if (m) { const n = cleanPhone(m[1]); const who = c2.slice(0, m.index).replace(/[-–:,\s]+$/, '').trim(); if (n && n !== main) out.push({ who: firstName(who) || 'Contact', num: n, label: 'Other contact' + (who ? ' (' + who.split(/\s+/)[0] + ')' : '') }); }
  return out;
}
const firstName = s => { const w = String(s || '').replace(/\s+/g, ' ').trim().split(' ')[0] || ''; return w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : ''; };
function fillTemplate(text, job, contact, mins) {
  const me = myInfo(); const start = (String(job.booth || '').match(/\d{1,2}(?::\d{2})?\s*[AaPp][Mm]/) || [''])[0];
  const venue = (job.venue || job.suburb || 'the venue').replace(/\s+/g, ' ').trim();
  const map = { '{name}': contact ? contact.who : firstName(job.client), '{venue}': venue, '{setup}': job.setup || 'the agreed time', '{start}': start || 'the start time', '{time}': job.booth || '', '{mins}': String(mins), '{me}': me.name || 'your photo booth technician', '{phone}': me.phone ? showPhone(cleanPhone(me.phone) || me.phone) : 'this number' };
  return text.replace(/\{(name|venue|setup|start|time|mins|me|phone)\}/g, k => map[k]);
}
const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

}

          if (it.failed) { b.innerHTML = '<span class="galph bad">Photo unavailable</span><em>' + esc(it.desc || '') + '</em>'; return; }
          if (!b.querySelector('img')) { b.disabled = false; b.querySelector('.galph').outerHTML = '<img alt="" src="' + it.img + '">'; } }); };
        galP = loadShareFiles(p.rc, draw).then(list => { draw(list); if (!list.some(x => x && x.img)) say('The receipt photos could not be loaded. The link may have expired.', 'bad'); }).catch(() => say('The receipt photos could not be loaded right now. Check the internet connection and open the link again.', 'bad'));
        $('galGrid').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b || b.disabled) return; const ok = gal.filter(x => x && x.img); openGallery(ok, ok.indexOf(gal[+b.dataset.g])); });
        if ($('shGal')) $('shGal').addEventListener('click', async () => { $('shGal').disabled = true; await galP; $('shGal').disabled = false; openGallery(gal, 0); });
      }
      $('shDl').addEventListener('click', async () => { $('shDl').disabled = true; await galP; const r = await downloadPdf(inv); $('shDl').disabled = false; say(r.msg, r.ok ? 'ok' : 'bad'); });
    } catch (err) {
      $('pwGo').disabled = false; $('pwMsg').className = 'status bad';
      $('pwMsg').textContent = (err && err.name === 'OperationError') ? 'That password is not right. Check it and try again.' : 'This link could not be opened. It may have been cut short when it was copied.';
    }
  });
}
function wireSharePanel(inv) {
  $('vShare').addEventListener('click', () => {
    const box = $('shareBox'); if (box.innerHTML) { box.innerHTML = ''; return; }
    const saved = store.get('sharePw', '');
    box.innerHTML = '<div class="sharepanel"><p>Make a link your boss can open in any browser. They will need the password to see the invoice and download the PDF.</p>' +
      '<div class="pwrow"><label class="f" for="shPw">Password for this link<input id="shPw" type="text" autocomplete="off" value="' + esc(saved) + '" placeholder="Choose a password"></label><label class="f" for="shDays" style="flex:0 1 150px">Link works for<select id="shDays" class="sel"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="0">No expiry</option></select></label><button class="primary" type="button" id="shMake">Create link</button></div>' +
      '<div id="shOut"></div><p class="hint">The invoice is locked inside the link itself. Receipt photos are locked with the same password and kept in your account until the link expires. Send the password separately from the link (for example, tell them once in person or by text).</p></div>';
    $('shMake').addEventListener('click', async () => {
      const pw = $('shPw').value; if (pw.length < 8) { $('shOut').innerHTML = '<p class="status bad">Use a password of at least 8 characters.</p>'; return; }
      store.set('sharePw', pw); $('shMake').disabled = true;
      try {
        const days = Number($('shDays').value); let rc = null;
        if ((inv.rows || []).some(r => r.receiptId)) { $('shOut').innerHTML = '<p class="status">Locking the receipt photos…</p>';
          try { rc = await uploadShareFiles(inv, days, (k, n) => { $('shOut').innerHTML = '<p class="status">Locking receipt photo ' + k + ' of ' + n + '…</p>'; }); } catch (e) { rc = { failed: true }; } }
        const link = await makeShareLink(inv, pw, days, rc && rc.sh ? rc : null);
        $('shOut').innerHTML = '<div class="linkrow"><input id="shLink" type="text" readonly value="' + esc(link) + '" aria-label="Share link"><button class="secondary" type="button" id="shCopy">Copy link</button>' +
          (navigator.share && !window.claude ? '<button class="secondary" type="button" id="shSend">Send…</button>' : '') + '</div><p class="status" id="shMsg" role="status"></p>' +
          (rc && rc.sh ? '<p class="status ok">' + rc.files.length + ' receipt photo' + (rc.files.length === 1 ? '' : 's') + ' included. Your boss will see them as a gallery under the invoice.</p>'
            : rc && rc.skipped ? '<p class="notice warn">The receipt photos are not in this link: sign in on the Account page first, then make the link again. (The downloaded PDF still has them.)</p>'
            : rc && rc.failed ? '<p class="notice warn">The receipt photos could not be added (no internet?). The invoice itself is in the link. Try again to include the photos.</p>' : '');
        $('shLink').addEventListener('focus', e => e.target.select());
        $('shCopy').addEventListener('click', () => {
          const done = ok => { $('shMsg').className = 'status ' + (ok ? 'ok' : ''); $('shMsg').textContent = ok ? 'Link copied. Paste it into your message.' : 'Select the link above and copy it.'; if (!ok) $('shLink').select(); };
          try { navigator.clipboard.writeText(link).then(() => done(true), () => done(false)); } catch (e) { done(false); }
        });
        if ($('shSend')) $('shSend').addEventListener('click', () => { navigator.share({ title: 'Tax invoice ' + inv.no, text: 'Tax invoice ' + inv.no + ' (' + fmtDate(inv.date) + ')', url: link }).catch(() => {}); });
      } catch (e) { $('shOut').innerHTML = '<p class="status bad">This browser could not make the link. Try a current version of Chrome, Safari or Edge.</p>'; }
      $('shMake').disabled = false;
    });
  });
}

if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

if (shareToken) renderShareViewer(); else render();
if (!window.jspdf && !shareToken) window.addEventListener('load', render);
(async function connect() {
  if (shareToken) { splash.hide(); return; }
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (use) {
    try { downloads = await use('downloads'); } catch (e) { downloads = null; }
    try { db = await use('db'); } catch (e) { db = null; }
  }
  if (db) {
    mode = 'db';
    let migrated = false;
    db.collection('invoices').onSnapshot(snap => {
      invoices = snap.docs.map(d => d.data());
      loaded = true; splash.hide();
      if (!migrated) { migrated = true; migrateLocal(); }
      if (route.name === 'edit') renderSide(); else render();
    }, () => { mode = 'local'; invoices = cleanList(store.get('invoices', [])); loaded = true; render(); splash.hide(); });
  } else {
    mode = 'local'; invoices = cleanList(store.get('invoices', []));
    if (!invoices.length && window.SK_SEED && !store.get('seeded', false)) { invoices = clone(window.SK_SEED); store.set('invoices', invoices); store.set('seeded', true); }
    loaded = true; render();
    cloud.init();
  }
})();
</script>
